<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>그림을 컬러링으로 변환</title>
  <meta name="description" content="사진·그림을 업로드하면 흑백 라인 컬러링 페이지로 즉시 변환하는 웹앱." />
  <link rel="canonical" href="https://dalmook.github.io/color_dalbong/" />
  <meta property="og:title" content="그림을 컬러링으로 변환" />
  <meta property="og:description" content="사진·그림을 업로드하면 흑백 라인 컬러링 페이지로 즉시 변환." />
  <meta property="og:url" content="https://dalmook.github.io/color_dalbong/" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://dalmook.github.io/color_dalbong/og.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9168248935486215" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="hero">
      <h1>그림을 컬러링으로 변환</h1>
      <p>사진·그림을 한 번에 컬러링 페이지로! 업로드 즉시 라인 변환하고 바로 색칠해요.</p>
    </header>

    <section class="panel">
      <div class="controls">
        <label class="file">
          <input id="fileInput" type="file" accept="image/*" />
          이미지 업로드
        </label>

        <label class="control">
          <span>선 굵기</span>
          <input id="lineWidth" type="range" min="1" max="6" value="2" />
        </label>

        <label class="control">
          <span>임계값</span>
          <input id="threshold" type="range" min="40" max="200" value="90" />
        </label>

        <button id="download" class="btn primary">다운로드</button>
      </div>

      <div class="canvas-grid">
        <div class="canvas-card">
          <div class="canvas-title">변환 이전</div>
          <div class="canvas-frame">
            <canvas id="sourceCanvas"></canvas>
          </div>
        </div>
        <div class="canvas-card">
          <div class="canvas-title">변환/색칠</div>
          <div class="canvas-frame">
            <div class="canvas-stack">
              <canvas id="colorCanvas"></canvas>
              <canvas id="lineCanvas"></canvas>
            </div>
          </div>
        </div>
      </div>
    </section>

    <footer class="foot">
      <p>모바일/태블릿 터치 지원 · 브라우저 내 즉시 처리</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
